// === Simple line chart (SVG) ===
function MiniChart({ data }) {
  if (data.length === 0) return null;
  const W = 320, H = 160, P = 24;
  const ys = data.map(d => d.oneRM);
  const minY = Math.min(...ys) * 0.9;
  const maxY = Math.max(...ys) * 1.05;
  const range = maxY - minY || 1;
  const stepX = data.length === 1 ? 0 : (W - P * 2) / (data.length - 1);
  const points = data.map((d, i) => {
    const x = P + i * stepX;
    const y = H - P - ((d.oneRM - minY) / range) * (H - P * 2);
    return { x, y, d };
  });
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 180 }}>
      {[0.25, 0.5, 0.75].map(t => (
        <line key={t} x1={P} y1={P + (H - P * 2) * t} x2={W - P} y2={P + (H - P * 2) * t}
          stroke={BORDER} strokeDasharray="3 3" strokeWidth="0.5" />
      ))}
      <path d={path} fill="none" stroke={NEON} strokeWidth="2" />
      {points.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="3" fill={NEON} />
      ))}
      {/* y-axis labels */}
      <text x={4} y={P + 4} fill="#666" fontSize="9">{maxY.toFixed(0)}</text>
      <text x={4} y={H - P + 4} fill="#666" fontSize="9">{minY.toFixed(0)}</text>
      {/* x-axis: first and last date */}
      <text x={P} y={H - 6} fill="#666" fontSize="9">{data[0]?.date}</text>
      {data.length > 1 && <text x={W - P} y={H - 6} fill="#666" fontSize="9" textAnchor="end">{data[data.length - 1]?.date}</text>}
    </svg>
  );
}

  const [exerciseModes, setExerciseModes] = useState(() => storage.get('exerciseModes') || {});
  const [selectedExerciseId, setSelectedExerciseId] = useState(null);
  const [weight, setWeight] = useState('');
  const [reps, setReps] = useState('');
  const [toast, setToast] = useState('');
  const [showPicker, setShowPicker] = useState(false);
  const [pickerGroup, setPickerGroup] = useState('全部');
  const [pickerSearch, setPickerSearch] = useState('');

  useEffect(() => { storage.set('sessions', sessions); }, [sessions]);
  useEffect(() => { storage.set('favorites', favorites); }, [favorites]);
  useEffect(() => { storage.set('exerciseModes', exerciseModes); }, [exerciseModes]);

  const toggleFavorite = (id) => {
    setFavorites(favorites.includes(id) ? favorites.filter(x => x !== id) : [...favorites, id]);
  };

  const toggleMode = (id) => {
    setExerciseModes({ ...exerciseModes, [id]: exerciseModes[id] === 'cut' ? 'bulk' : 'cut' });
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2000);
  };

  const logSet = () => {
    if (!selectedExerciseId || !weight || !reps) { showToast('全部入れてね'); return; }
    const w = parseFloat(weight);
    const r = parseInt(reps);
    if (isNaN(w) || isNaN(r) || w <= 0 || r <= 0) { showToast('数値が変だよ'); return; }
    const newSession = {
      id: 'ses_' + Date.now(),
      date: new Date().toISOString(),
      exerciseId: selectedExerciseId,
      weight: w,
      reps: r,
    };
    setSessions([newSession, ...sessions]);
    setWeight(''); setReps('');
    const ex = PRESET_EXERCISES.find((e) => e.id === selectedExerciseId);
    const oneRM = (w * (1 + r / 30)).toFixed(1);
    showToast(`${ex.name} ${w}kg×${r} → 1RM ${oneRM}kg`);
  };

  const deleteSession = (id) => setSessions(sessions.filter((s) => s.id !== id));

  const usedExercises = useMemo(() => {
    const ids = [...new Set(sessions.map(s => s.exerciseId))];
    return ids.map(id => PRESET_EXERCISES.find(e => e.id === id)).filter(Boolean);
  }, [sessions]);

  const stats = useMemo(() => {
    const byEx = {};
    PRESET_EXERCISES.forEach((e) => {
      const list = sessions.filter((s) => s.exerciseId === e.id);
      const max1RM = list.reduce((m, s) => Math.max(m, epley(s.weight, s.reps)), 0);
      byEx[e.id] = { count: list.length, max1RM };
    });
    return byEx;
  }, [sessions]);

  const totalVolume = useMemo(() => sessions.reduce((sum, s) => sum + s.weight * s.reps, 0), [sessions]);
  const last7Days = useMemo(() => {
    const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
    return sessions.filter((s) => new Date(s.date).getTime() > cutoff).length;
  }, [sessions]);

  const pickerList = useMemo(() => {
    let list = PRESET_EXERCISES;
    if (pickerGroup !== '全部') list = list.filter(e => e.group === pickerGroup);
    if (pickerSearch.trim()) {
      const q = pickerSearch.trim().toLowerCase();
      list = list.filter(e => e.name.toLowerCase().includes(q));
    }
    return list;
  }, [pickerGroup, pickerSearch]);

  return (
    <div style={styles.app}>
      <div style={styles.header}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <IconDumbbell size={24} color={NEON} />
          <div>
            <div style={styles.brand}>IRON LOG</div>
            <div style={styles.subBrand}>workout tracker</div>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 12 }}>
          <Stat label="TOTAL VOL" value={`${(totalVolume / 1000).toFixed(1)}t`} />
          <Stat label="7D" value={last7Days} />
        </div>
      </div>

      <div style={styles.content} className="scroll">
        {view === 'log' && (
          <LogView
            sessions={sessions} favorites={favorites}
            selectedExerciseId={selectedExerciseId} setSelectedExerciseId={setSelectedExerciseId}
            setShowPicker={setShowPicker}
            weight={weight} setWeight={setWeight}
            reps={reps} setReps={setReps}
            logSet={logSet} deleteSession={deleteSession}
            exerciseModes={exerciseModes} toggleMode={toggleMode}
          />
        )}
        {view === 'history' && <HistoryView sessions={sessions} usedExercises={usedExercises} setSessions={setSessions} favorites={favorites} setFavorites={setFavorites} exerciseModes={exerciseModes} setExerciseModes={setExerciseModes} showToast={showToast} />}
        {view === 'browse' && <BrowseView stats={stats} favorites={favorites} toggleFavorite={toggleFavorite} />}
        {view === 'plan' && <PlanView sessions={sessions} exerciseModes={exerciseModes} setSelectedExerciseId={setSelectedExerciseId} setWeight={setWeight} setReps={setReps} setView={setView} showToast={showToast} />}
        {view === 'calc' && <CalcView />}
      </div>

      <div style={styles.tabBar}>
        <Tab icon={<IconZap size={18} />} label="記録" active={view === 'log'} onClick={() => setView('log')} />
        <Tab icon={<IconActivity size={18} />} label="履歴" active={view === 'history'} onClick={() => setView('history')} />
        <Tab icon={<IconTarget size={18} />} label="種目" active={view === 'browse'} onClick={() => setView('browse')} />
        <Tab icon={<IconPlan size={18} />} label="計画" active={view === 'plan'} onClick={() => setView('plan')} />
        <Tab icon={<IconTrend size={18} />} label="1RM" active={view === 'calc'} onClick={() => setView('calc')} />
      </div>

      {showPicker && (
        <ExercisePicker
          list={pickerList}
          group={pickerGroup} setGroup={setPickerGroup}
          search={pickerSearch} setSearch={setPickerSearch}
          favorites={favorites} toggleFavorite={toggleFavorite}
          onPick={(id) => { setSelectedExerciseId(id); setShowPicker(false); setPickerSearch(''); }}
          onClose={() => { setShowPicker(false); setPickerSearch(''); }}
        />
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

function LogView({ sessions, favorites, selectedExerciseId, setSelectedExerciseId, setShowPicker, weight, setWeight, reps, setReps, logSet, deleteSession, exerciseModes, toggleMode }) {
  const today = new Date().toDateString();
  const todaySessions = sessions.filter((s) => new Date(s.date).toDateString() === today);
  const selectedExercise = PRESET_EXERCISES.find(e => e.id === selectedExerciseId);
  const currentMode = selectedExerciseId ? (exerciseModes[selectedExerciseId] || 'bulk') : 'bulk';

  const recentIds = [...new Set(sessions.slice(0, 30).map(s => s.exerciseId))].slice(0, 5);
  const quickIds = [...new Set([...favorites, ...recentIds])].slice(0, 6);
  const quickExercises = quickIds.map(id => PRESET_EXERCISES.find(e => e.id === id)).filter(Boolean);

  // 前回の記録(選択中種目、今日のセッションを除く直近の同一日の全セット)
  const lastWorkout = useMemo(() => {
    if (!selectedExerciseId) return null;
    const past = sessions
      .filter(s => s.exerciseId === selectedExerciseId && new Date(s.date).toDateString() !== today);
    if (past.length === 0) return null;
    const lastDate = new Date(past[0].date).toDateString();
    const sets = past.filter(s => new Date(s.date).toDateString() === lastDate);
    return { date: lastDate, sets };
  }, [selectedExerciseId, sessions, today]);

  // 次セットの推奨(バルク=8回目標、カット=15回目標)
  // ロジック: ACSMガイドライン準拠 (バルク 8-12reps@70-85%1RM / カット 12-20reps@<70%1RM)
  // セットごとに重量を下げて回数を維持する現実的運用に対応
  const recommendation = useMemo(() => {
    if (!selectedExerciseId) return null;
    const isBulk = currentMode === 'bulk';
    const targetReps = isBulk ? 8 : 15;
    const lowFloor = isBulk ? 5 : 11; // これ以下なら重量を落とす
    const todayForEx = todaySessions.filter(s => s.exerciseId === selectedExerciseId);

    // 今日まだ未着手 → 前回1セット目を基準に判定
    if (todayForEx.length === 0) {
      if (!lastWorkout) return null;
      // 前回の1セット目を取得(sessionsは新しい順なので最後尾が1セット目)
      const firstSet = lastWorkout.sets[lastWorkout.sets.length - 1];
      if (firstSet.reps >= targetReps) {
        return {
          weight: firstSet.weight + 2.5,
          reps: targetReps,
          setNum: 1,
          reason: `前回1set ${firstSet.weight}kg×${firstSet.reps} → 達成 +2.5kg`
        };
      } else if (firstSet.reps <= lowFloor) {
        return {
          weight: Math.max(0, firstSet.weight - 2.5),
          reps: targetReps,
          setNum: 1,
          reason: `前回1set ${firstSet.weight}kg×${firstSet.reps} → 低調 −2.5kg`
        };
      }
      return {
        weight: firstSet.weight,
        reps: targetReps,
        setNum: 1,
        reason: `前回1set ${firstSet.weight}kg×${firstSet.reps} → 同重量で継続`
      };
    }

    // 2セット目以降 → 直前セットを見つつ、疲労を考慮して重量を下げる
    const prev = todayForEx[0]; // 直前セット
    const setNum = todayForEx.length + 1;
    // 直前が極端に低調なら更に -2.5kg、それ以外も基本 -2.5kg(疲労前提)
    const drop = prev.reps <= lowFloor ? 5 : 2.5;
    const newWeight = Math.max(0, prev.weight - drop);
    const minReps = isBulk ? 6 : 12;
    return {
      weight: newWeight,
      reps: minReps,
      setNum,
      reason: `${setNum}set目 −${drop}kg(疲労を考慮)`
    };
  }, [selectedExerciseId, todaySessions, lastWorkout, currentMode]);

  const applyRecommendation = () => {
    if (!recommendation) return;
    setWeight(String(recommendation.weight));
    setReps(String(recommendation.reps));
  };

  return (
    <div style={{ animation: 'slideUp 0.3s ease' }}>
      <SectionLabel text="TODAY · " accent={new Date().toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' })} />

      {quickExercises.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 9, color: '#555', letterSpacing: 1.5, marginBottom: 6 }}>QUICK SELECT</div>
          <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 4 }} className="scroll">
            {quickExercises.map((ex) => (
              <button key={ex.id} onClick={() => setSelectedExerciseId(ex.id)}
                style={{ ...styles.chip, ...(selectedExerciseId === ex.id ? styles.chipActive : {}), fontSize: 12, padding: '6px 12px' }}>
                {favorites.includes(ex.id) && '★ '}{ex.name}
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={styles.card}>
        <label style={styles.inputLabel}>EXERCISE</label>
        <button onClick={() => setShowPicker(true)} style={styles.selectorBtn}>
          <span style={{ color: selectedExercise ? '#fff' : '#555' }}>
            {selectedExercise ? selectedExercise.name : '種目を選ぶ →'}
          </span>
          {selectedExercise && <span style={styles.groupBadge}>{selectedExercise.group}</span>}
        </button>

        {selectedExercise && (
          <div style={{ display: 'flex', gap: 6, marginTop: 10 }}>
            <button onClick={() => toggleMode(selectedExerciseId)} style={{
              flex: 1, padding: '8px 12px',
              background: currentMode === 'bulk' ? 'rgba(0,255,136,0.12)' : '#141414',
              border: `1px solid ${currentMode === 'bulk' ? 'rgba(0,255,136,0.4)' : '#222'}`,
              color: currentMode === 'bulk' ? NEON : '#666',
              borderRadius: 8, fontFamily: 'inherit', fontSize: 11, letterSpacing: 1.5, cursor: 'pointer'
            }}>
              BULK · 8reps
            </button>
            <button onClick={() => toggleMode(selectedExerciseId)} style={{
              flex: 1, padding: '8px 12px',
              background: currentMode === 'cut' ? 'rgba(0,255,136,0.12)' : '#141414',
              border: `1px solid ${currentMode === 'cut' ? 'rgba(0,255,136,0.4)' : '#222'}`,
              color: currentMode === 'cut' ? NEON : '#666',
              borderRadius: 8, fontFamily: 'inherit', fontSize: 11, letterSpacing: 1.5, cursor: 'pointer'
            }}>
              CUT · 15reps
            </button>
          </div>
        )}

        {selectedExercise && lastWorkout && (
          <div style={{ marginTop: 12, padding: 10, background: '#0d0d0d', border: '1px solid #1a1a1a', borderRadius: 8 }}>
            <div style={{ fontSize: 9, color: '#555', letterSpacing: 1.5, marginBottom: 6 }}>
              LAST · {new Date(lastWorkout.sets[0].date).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' })}
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {lastWorkout.sets.slice().reverse().map((s, i) => (
                <span key={s.id} style={{ background: '#1a1a1a', border: '1px solid #222', color: '#ccc', padding: '4px 8px', borderRadius: 6, fontSize: 11, fontVariantNumeric: 'tabular-nums' }}>
                  <span style={{ color: '#666' }}>{i+1}</span> {s.weight}<span style={{ color: '#666' }}>kg</span> × {s.reps}
                </span>
              ))}
            </div>
          </div>
        )}

        {selectedExercise && recommendation && (
          <button onClick={applyRecommendation} style={{
            width: '100%', marginTop: 10, padding: '12px 14px',
            background: 'rgba(0,255,136,0.06)', border: '1px solid rgba(0,255,136,0.3)',
            borderRadius: 10, color: '#eee', textAlign: 'left',
            fontFamily: 'inherit', cursor: 'pointer', display: 'flex',
            justifyContent: 'space-between', alignItems: 'center', gap: 8
          }}>
            <div>
              <div style={{ fontSize: 9, color: NEON, letterSpacing: 1.5, marginBottom: 4 }}>
                NEXT · {recommendation.setNum}set目 推奨
              </div>
              <div style={{ fontSize: 16, fontWeight: 600, fontFamily: 'Bebas Neue, sans-serif', letterSpacing: 1 }}>
                <span style={{ color: NEON }}>{recommendation.weight}</span>
                <span style={{ color: '#666', fontSize: 12, margin: '0 4px' }}>kg</span>
                ×
                <span style={{ color: NEON, marginLeft: 4 }}>{recommendation.reps}</span>
              </div>
              <div style={{ fontSize: 10, color: '#777', marginTop: 3 }}>{recommendation.reason}</div>
            </div>
            <div style={{ fontSize: 10, color: NEON, letterSpacing: 1, padding: '6px 10px', border: '1px solid rgba(0,255,136,0.3)', borderRadius: 6 }}>TAP</div>
          </button>
        )}

        <div style={{ display: 'flex', gap: 12, marginTop: 14 }}>
          <div style={{ flex: 1 }}>
            <label style={styles.inputLabel}>WEIGHT (kg)</label>
            <input type="number" inputMode="decimal" value={weight} onChange={(e) => setWeight(e.target.value)} placeholder="80" style={styles.input} />
          </div>
          <div style={{ flex: 1 }}>
            <label style={styles.inputLabel}>REPS</label>
            <input type="number" inputMode="numeric" value={reps} onChange={(e) => setReps(e.target.value)} placeholder="5" style={styles.input} />
          </div>
        </div>

        {weight && reps && !isNaN(parseFloat(weight)) && !isNaN(parseInt(reps)) && (
          <div style={styles.predictBox}>
            推定1RM <span style={{ color: NEON, fontWeight: 700 }}>{(parseFloat(weight) * (1 + parseInt(reps) / 30)).toFixed(1)}kg</span>
          </div>
        )}
        <button onClick={logSet} style={styles.primaryBtn}>
          <IconPlus size={18} color="#000" /> セットを記録
        </button>
      </div>

      <SectionLabel text="TODAY'S SETS" accent={`${todaySessions.length}`} />
      {todaySessions.length === 0 ? (
        <div style={styles.emptySmall}>まだセットなし</div>
      ) : (
        todaySessions.map((s) => {
          const ex = PRESET_EXERCISES.find((e) => e.id === s.exerciseId);
          const oneRM = (s.weight * (1 + s.reps / 30)).toFixed(1);
          return (
            <div key={s.id} style={styles.sessionRow}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 15, fontWeight: 600, color: '#eee' }}>{ex?.name || '?'}</div>
                <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>
                  {s.weight}kg × {s.reps}回 · 1RM {oneRM}kg
                </div>
              </div>
              <button onClick={() => deleteSession(s.id)} style={styles.iconBtn}>
                <IconX size={16} />
              </button>
            </div>
          );
        })
      )}
    </div>
  );
}

function ExercisePicker({ list, group, setGroup, search, setSearch, favorites, toggleFavorite, onPick, onClose }) {
  const grouped = useMemo(() => {
    const g = {};
    list.forEach(ex => {
      if (!g[ex.group]) g[ex.group] = [];
      g[ex.group].push(ex);
    });
    return g;
  }, [list]);

  return (
    <div style={styles.modalBackdrop} onClick={onClose}>
      <div style={styles.modal} onClick={e => e.stopPropagation()}>
        <div style={styles.modalHeader}>
          <div style={{ fontSize: 13, color: NEON, letterSpacing: 2 }}>SELECT EXERCISE</div>
          <button onClick={onClose} style={styles.iconBtn}><IconX size={20} /></button>
        </div>

        <div style={{ padding: '0 16px' }}>
          <div style={{ position: 'relative', marginBottom: 10 }}>
            <span style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)' }}><SearchIcon /></span>
            <input type="text" value={search} onChange={e => setSearch(e.target.value)}
              placeholder="種目を検索..." autoFocus
              style={{ ...styles.input, paddingLeft: 34, fontSize: 14, fontFamily: 'inherit', letterSpacing: 0 }} />
          </div>

          <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 8 }} className="scroll">
            {GROUPS.map(g => (
              <button key={g} onClick={() => setGroup(g)}
                style={{ ...styles.chip, ...(group === g ? styles.chipActive : {}), fontSize: 12, padding: '6px 14px' }}>
                {g}
              </button>
            ))}
          </div>
        </div>

        <div style={styles.modalList} className="scroll">
          {Object.keys(grouped).length === 0 ? (
            <div style={styles.emptySmall}>該当する種目なし</div>
          ) : (
            Object.entries(grouped).map(([gName, items]) => (
              <div key={gName} style={{ marginBottom: 14 }}>
                <div style={styles.groupHeader}>{gName} · {items.length}</div>
                {items.map(ex => (
                  <div key={ex.id} style={styles.pickerRow}>
                    <button onClick={() => toggleFavorite(ex.id)} style={styles.starBtn}>
                      <IconStar filled={favorites.includes(ex.id)} size={16} />
                    </button>
                    <button onClick={() => onPick(ex.id)} style={styles.pickerNameBtn}>
                      {ex.name}
                    </button>
                  </div>
                ))}
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
}

function HistoryView({ sessions, usedExercises, setSessions, favorites, setFavorites, exerciseModes, setExerciseModes, showToast }) {
  const [picked, setPicked] = useState(usedExercises[0]?.id || null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (picked && !usedExercises.find(e => e.id === picked)) setPicked(usedExercises[0]?.id || null);
    else if (!picked && usedExercises.length > 0) setPicked(usedExercises[0].id);
  }, [usedExercises, picked]);

  const exportData = () => {
    const data = {
      app: 'IRON LOG',
      version: 2,
      exportedAt: new Date().toISOString(),
      sessions,
      favorites,
      exerciseModes
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10).replace(/-/g, '');
    a.download = `iron-log-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`${sessions.length}セットをエクスポート`);
  };

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.sessions || !Array.isArray(data.sessions)) throw new Error('形式が違います');
        const mode = window.confirm(
          `${data.sessions.length}セットを読み込みます。\n\n[OK] 現在の記録と統合(重複は除外)\n[キャンセル] 何もしない`
        );
        if (!mode) return;
        const existingIds = new Set(sessions.map(s => s.id));
        const merged = [...sessions];
        let added = 0;
        data.sessions.forEach(s => {
          if (!existingIds.has(s.id)) { merged.push(s); added++; }
        });
        merged.sort((a, b) => new Date(b.date) - new Date(a.date));
        setSessions(merged);
        if (Array.isArray(data.favorites)) {
          setFavorites([...new Set([...favorites, ...data.favorites])]);
        }
        if (data.exerciseModes && typeof data.exerciseModes === 'object') {
          setExerciseModes({ ...exerciseModes, ...data.exerciseModes });
        }
        showToast(`${added}セットを追加`);
      } catch (err) {
        alert('読み込みに失敗しました: ' + err.message);
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  };

  const chartData = useMemo(() => {
    if (!picked) return [];
    return sessions
      .filter((s) => s.exerciseId === picked)
      .slice().reverse()
      .map((s) => ({
        date: new Date(s.date).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }),
        oneRM: parseFloat((s.weight * (1 + s.reps / 30)).toFixed(1)),
      }));
  }, [picked, sessions]);

  const backupSection = (
    <React.Fragment>
      <SectionLabel text="BACKUP" />
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <button onClick={exportData} style={{
          flex: 1, background: '#141414', border: '1px solid #222',
          color: '#eee', padding: '10px 12px', borderRadius: 10,
          fontFamily: 'inherit', fontSize: 12, letterSpacing: 1, cursor: 'pointer'
        }}>
          <span style={{ color: NEON, marginRight: 6 }}>↓</span>EXPORT
        </button>
        <button onClick={() => fileInputRef.current?.click()} style={{
          flex: 1, background: '#141414', border: '1px solid #222',
          color: '#eee', padding: '10px 12px', borderRadius: 10,
          fontFamily: 'inherit', fontSize: 12, letterSpacing: 1, cursor: 'pointer'
        }}>
          <span style={{ color: NEON, marginRight: 6 }}>↑</span>IMPORT
        </button>
        <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={importData} style={{ display: 'none' }} />
      </div>
    </React.Fragment>
  );

  if (usedExercises.length === 0) {
    return (
      <div style={{ animation: 'slideUp 0.3s ease' }}>
        {backupSection}
        <SectionLabel text="PROGRESS" />
        <div style={styles.empty}>まずは記録から始めよう</div>
      </div>
    );
  }

  return (
    <div style={{ animation: 'slideUp 0.3s ease' }}>
      {backupSection}
      <SectionLabel text="PROGRESS" />

function PlanView({ sessions, exerciseModes, setSelectedExerciseId, setWeight, setReps, setView, showToast }) {
  const [selectedGroups, setSelectedGroups] = useState([]);
  const [planMode, setPlanMode] = useState('bulk'); // 'bulk' | 'cut'
  const [volume, setVolume] = useState('standard'); // 'light' | 'standard' | 'heavy'
  const [plan, setPlan] = useState(null);
  const PARTS = ['胸', '背中', '肩', '腕', '脚', 'お尻', '体幹'];

  const toggleGroup = (g) => {
    setSelectedGroups(selectedGroups.includes(g)
      ? selectedGroups.filter(x => x !== g)
      : [...selectedGroups, g]);
  };

  // 種目ごとの「前回1セット目の重量」を取得
  const getLastFirstSetWeight = (exerciseId) => {
    const past = sessions.filter(s => s.exerciseId === exerciseId);
    if (past.length === 0) return null;
    const latestDate = new Date(past[0].date).toDateString();
    const sameDay = past.filter(s => new Date(s.date).toDateString() === latestDate);
    const firstSet = sameDay[sameDay.length - 1];
    return { weight: firstSet.weight, reps: firstSet.reps };
  };

  const recommendWeight = (exerciseId, mode) => {
    const last = getLastFirstSetWeight(exerciseId);
    const targetReps = mode === 'bulk' ? 8 : 15;
    const lowFloor = mode === 'bulk' ? 5 : 11;
    if (!last) return { weight: null, reps: targetReps, isNew: true };
    if (last.reps >= targetReps) {
      return { weight: last.weight + 2.5, reps: targetReps, isNew: false, note: '前回達成 +2.5kg' };
    } else if (last.reps <= lowFloor) {
      return { weight: Math.max(0, last.weight - 2.5), reps: targetReps, isNew: false, note: '前回低調 −2.5kg' };
    }
    return { weight: last.weight, reps: targetReps, isNew: false, note: '同重量で継続' };
  };

  // 部位ごとの目標種目数を決定
  const getPerGroupCount = (groupCount, vol) => {
    // [LIGHT, STANDARD, HEAVY] × 部位数で表
    const table = {
      light:    { 1: 3, 2: 4, 3: 5, 4: 6, 5: 6, 6: 6, 7: 7 },
      standard: { 1: 5, 2: 6, 3: 8, 4: 8, 5: 9, 6: 9, 7: 10 },
      heavy:    { 1: 6, 2: 8, 3: 10, 4: 11, 5: 12, 6: 12, 7: 13 },
    };
    return table[vol][groupCount] || (groupCount * 2);
  };

  const buildPlan = () => {
    if (selectedGroups.length === 0) {
      showToast('部位を選んでね');
      return;
    }
    const totalTarget = getPerGroupCount(selectedGroups.length, volume);

    // 部位ごとに種目を構築
    const picksByGroup = {};

    for (const group of selectedGroups) {
      const groupExercises = PRESET_EXERCISES.filter(e => e.group === group)
        .map(ex => ({
          ...ex,
          region: exerciseRegion(ex.id),
          rank: liftRank(ex.id),
          compound: isCompound(ex.id),
        }));

      const essentialRegions = ESSENTIAL_REGIONS[group] || [];
      const picked = [];
      const coveredRegions = new Set();

      // STEP 1: 必須regionそれぞれから「最も適切な種目」を1つ選ぶ
      // バルクならコンパウンド優先、その中で重い順
      // カットならアイソレーション優先、軽め
      for (const region of essentialRegions) {
        const candidates = groupExercises.filter(e =>
          e.region === region && !picked.find(p => p.id === e.id)
        );
        if (candidates.length === 0) continue;

        let chosen;
        if (planMode === 'bulk') {
          // バルク: コンパウンド優先・重い順
          chosen = candidates.slice().sort((a, b) => {
            if (a.compound !== b.compound) return a.compound ? -1 : 1;
            return b.rank - a.rank;
          })[0];
        } else {
          // カット: アイソレーション(軽め)優先
          chosen = candidates.slice().sort((a, b) => {
            if (a.compound !== b.compound) return a.compound ? 1 : -1;
            return a.rank - b.rank;
          })[0];
        }
        picked.push(chosen);
        coveredRegions.add(region);
      }

      picksByGroup[group] = { picked, essentialRegions, all: groupExercises };
    }

    // 全部位の essential region カバー後の残り枠を計算
    const usedCount = Object.values(picksByGroup).reduce((sum, x) => sum + x.picked.length, 0);
    const remaining = Math.max(0, totalTarget - usedCount);

    // STEP 2: 残り枠を部位に均等に追加(重要region優先で2種目目を投入)
    // 各region毎の上限を2種目とし、まずは未カバーregionと薄い regionから埋める
    if (remaining > 0) {
      const REGION_CAP = 2; // 同じregionから最大2種目まで
      const queue = [];
      for (const group of selectedGroups) {
        const data = picksByGroup[group];
        const additional = data.all
          .filter(e => !data.picked.find(p => p.id === e.id));
        additional.forEach(ex => {
          queue.push({ group, exercise: ex });
        });
      }
      // 「未充足regionの優先度」を毎ループ評価する貪欲法
      let added = 0;
      while (added < remaining && queue.length > 0) {
        // 残り候補に対し、現在のpickedを見て最適な1つを選ぶ
        let bestIdx = -1;
        let bestScore = null;
        for (let i = 0; i < queue.length; i++) {
          const { group, exercise: ex } = queue[i];
          const data = picksByGroup[group];
          const regionCount = data.picked.filter(p => p.region === ex.region).length;
          if (regionCount >= REGION_CAP) continue; // 上限到達でスキップ

          // スコア: 低いほど優先
          // 1. regionCountが少ない方が優先(まだ薄いregionを埋める)
          // 2. 部位の picked 数が少ない方が優先(部位間バランス)
          // 3. モード別: bulkはコンパウンド・重い順 / cutはアイソレーション・軽い順
          const groupSize = data.picked.length;
          const compScore = planMode === 'bulk' ? (ex.compound ? 0 : 1) : (ex.compound ? 1 : 0);
          const rankScore = planMode === 'bulk' ? -ex.rank : ex.rank;
          const score = [regionCount, groupSize, compScore, rankScore];

          if (bestScore === null ||
              score[0] < bestScore[0] ||
              (score[0] === bestScore[0] && score[1] < bestScore[1]) ||
              (score[0] === bestScore[0] && score[1] === bestScore[1] && score[2] < bestScore[2]) ||
              (score[0] === bestScore[0] && score[1] === bestScore[1] && score[2] === bestScore[2] && score[3] < bestScore[3])) {
            bestScore = score;
            bestIdx = i;
          }
        }
        if (bestIdx === -1) break;
        const chosen = queue.splice(bestIdx, 1)[0];
        picksByGroup[chosen.group].picked.push(chosen.exercise);
        added++;
      }
    }

    // STEP 3: 全部位の picked を集めて、最終順序に並べる
    // バルク: 全種目をコンパウンド優先・重い順 / カット: 軽い順→重い、体幹は最後
    let allPicked = [];
    for (const group of selectedGroups) {
      allPicked = allPicked.concat(picksByGroup[group].picked);
    }

    let sorted;
    if (planMode === 'bulk') {
      sorted = allPicked.slice().sort((a, b) => {
        if (a.compound !== b.compound) return a.compound ? -1 : 1;
        return b.rank - a.rank;
      });
    } else {
      sorted = allPicked.slice().sort((a, b) => {
        const ag = a.group === '体幹' ? 1 : 0;
        const bg = b.group === '体幹' ? 1 : 0;
        if (ag !== bg) return ag - bg;
        return a.rank - b.rank;
      });
    }

    // 推奨重量を付与
    const planItems = sorted.map(ex => ({
      ...ex,
      rec: recommendWeight(ex.id, planMode),
    }));

    setPlan({ mode: planMode, groups: [...selectedGroups], volume, items: planItems });
  };

  const startExercise = (exerciseId, rec) => {
    setSelectedExerciseId(exerciseId);
    if (rec.weight !== null) {
      setWeight(String(rec.weight));
      setReps(String(rec.reps));
    } else {
      setWeight('');
      setReps('');
    }
    setView('log');
  };

  const regionLabel = (region) => {
    const map = {
      upper: '上部', mid: '中部', lower: '下部',
      width: '広がり', thickness: '厚み', lower_back: '腰',
      anterior: '前部', medial: '中部', posterior: '後部',
      biceps: '二頭', triceps: '三頭', forearm: '前腕',
      quad: '大腿四', ham: 'ハム', calf: 'カーフ',
      glute: '臀', abs: '腹直', oblique: '腹斜',
    };
    return map[region] || '';
  };

  return (
    <div style={{ animation: 'slideUp 0.3s ease' }}>
      <SectionLabel text="TODAY'S PLAN" />

      <div style={styles.card}>
        <label style={styles.inputLabel}>BODY PARTS · 複数選択可</label>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 14 }}>
          {PARTS.map(g => (
            <button key={g} onClick={() => toggleGroup(g)} style={{
              padding: '8px 14px',
              background: selectedGroups.includes(g) ? 'rgba(0,255,136,0.12)' : '#141414',
              border: `1px solid ${selectedGroups.includes(g) ? 'rgba(0,255,136,0.4)' : '#222'}`,
              color: selectedGroups.includes(g) ? NEON : '#888',
              borderRadius: 999, fontFamily: 'inherit', fontSize: 13, cursor: 'pointer',
              fontWeight: selectedGroups.includes(g) ? 600 : 400
            }}>
              {g}
            </button>
          ))}
        </div>

        <label style={styles.inputLabel}>MODE</label>
        <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
          <button onClick={() => setPlanMode('bulk')} style={{
            flex: 1, padding: '10px',
            background: planMode === 'bulk' ? 'rgba(0,255,136,0.12)' : '#141414',
            border: `1px solid ${planMode === 'bulk' ? 'rgba(0,255,136,0.4)' : '#222'}`,
            color: planMode === 'bulk' ? NEON : '#666',
            borderRadius: 8, fontFamily: 'inherit', fontSize: 12, letterSpacing: 1.5, cursor: 'pointer'
          }}>
            BULK · 8reps
          </button>
          <button onClick={() => setPlanMode('cut')} style={{
            flex: 1, padding: '10px',
            background: planMode === 'cut' ? 'rgba(0,255,136,0.12)' : '#141414',
            border: `1px solid ${planMode === 'cut' ? 'rgba(0,255,136,0.4)' : '#222'}`,
            color: planMode === 'cut' ? NEON : '#666',
            borderRadius: 8, fontFamily: 'inherit', fontSize: 12, letterSpacing: 1.5, cursor: 'pointer'
          }}>
            CUT · 15reps
          </button>
        </div>

        <label style={styles.inputLabel}>VOLUME</label>
        <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
          {[
            { k: 'light', l: 'LIGHT', s: '短時間' },
            { k: 'standard', l: 'STANDARD', s: '標準' },
            { k: 'heavy', l: 'HEAVY', s: '徹底' },
          ].map(v => (
            <button key={v.k} onClick={() => setVolume(v.k)} style={{
              flex: 1, padding: '8px 4px',
              background: volume === v.k ? 'rgba(0,255,136,0.12)' : '#141414',
              border: `1px solid ${volume === v.k ? 'rgba(0,255,136,0.4)' : '#222'}`,
              color: volume === v.k ? NEON : '#666',
              borderRadius: 8, fontFamily: 'inherit', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2
            }}>
              <span style={{ fontSize: 11, letterSpacing: 1.5, fontWeight: 600 }}>{v.l}</span>
              <span style={{ fontSize: 9, opacity: 0.7 }}>{v.s}</span>
            </button>
          ))}
        </div>

        <button onClick={buildPlan} style={styles.primaryBtn}>
          <IconPlus size={18} color="#000" /> メニューを作る
        </button>
      </div>

      {plan && (
        <React.Fragment>
          <SectionLabel text={`MENU · ${plan.groups.join(' / ')}`} accent={`${plan.items.length}`} />
          {plan.items.map((ex, i) => (
            <button key={ex.id} onClick={() => startExercise(ex.id, ex.rec)} style={{
              width: '100%', display: 'flex', alignItems: 'center', gap: 12,
              background: '#141414', border: '1px solid #222',
              borderRadius: 12, padding: 14, marginBottom: 8,
              textAlign: 'left', fontFamily: 'inherit', cursor: 'pointer',
              color: '#eee'
            }}>
              <div style={{
                width: 32, height: 32, borderRadius: 8,
                background: 'rgba(0,255,136,0.12)', color: NEON,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 16, fontWeight: 700, fontFamily: 'Bebas Neue, sans-serif',
                letterSpacing: 1, flexShrink: 0
              }}>{i + 1}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: 6, marginBottom: 3, flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 14, fontWeight: 600, color: '#eee' }}>{ex.name}</span>
                  <span style={styles.groupBadge}>{ex.group}</span>
                  {regionLabel(ex.region) && (
                    <span style={{ fontSize: 9, color: '#888', letterSpacing: 1, border: '1px solid #333', padding: '2px 5px', borderRadius: 3 }}>
                      {regionLabel(ex.region)}
                    </span>
                  )}
                  {ex.compound && <span style={{ fontSize: 9, color: NEON, letterSpacing: 1 }}>COMP</span>}
                </div>
                {ex.rec.weight !== null ? (
                  <div style={{ fontSize: 12, color: '#888', fontVariantNumeric: 'tabular-nums' }}>
                    推奨 <span style={{ color: NEON, fontWeight: 600 }}>{ex.rec.weight}kg × {ex.rec.reps}</span>
                    <span style={{ color: '#555', marginLeft: 6, fontSize: 10 }}>{ex.rec.note}</span>
                  </div>
                ) : (
                  <div style={{ fontSize: 12, color: '#666' }}>初回 · 適切な重量を選んで</div>
                )}
              </div>
              <span style={{ color: NEON, fontSize: 18 }}>›</span>
            </button>
          ))}
          <div style={{ padding: '14px 0', textAlign: 'center', fontSize: 11, color: '#555', letterSpacing: 1 }}>
            足りなければ「記録」タブから自由に追加 · タップで開始
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function CalcView() {
  const [w, setW] = useState('');
  const [r, setR] = useState('');
  const wn = parseFloat(w);
  const rn = parseInt(r);
  const valid = !isNaN(wn) && !isNaN(rn) && wn > 0 && rn > 0;
  const ep = valid ? wn * (1 + rn / 30) : 0;
  const br = valid && rn < 37 ? wn / (1.0278 - 0.0278 * rn) : 0;
  const avg = valid ? (ep + br) / 2 : 0;
  const percentages = [95, 90, 85, 80, 75, 70, 65, 60];

  return (
    <div style={{ animation: 'slideUp 0.3s ease' }}>
      <SectionLabel text="1RM CALCULATOR" />
      <div style={styles.card}>
        <div style={{ display: 'flex', gap: 12 }}>
          <div style={{ flex: 1 }}>
            <label style={styles.inputLabel}>WEIGHT (kg)</label>
            <input type="number" inputMode="decimal" value={w} onChange={(e) => setW(e.target.value)} placeholder="80" style={styles.input} />
          </div>
          <div style={{ flex: 1 }}>
            <label style={styles.inputLabel}>REPS</label>
            <input type="number" inputMode="numeric" value={r} onChange={(e) => setR(e.target.value)} placeholder="5" style={styles.input} />
          </div>
        </div>
      </div>

      {valid && (
        <React.Fragment>
          <div style={{ ...styles.card, textAlign: 'center', padding: 24, animation: 'glow 2s infinite' }}>
            <div style={{ fontSize: 11, color: '#888', letterSpacing: 2, marginBottom: 8 }}>推定 1RM</div>
            <div style={{ fontSize: 48, fontWeight: 700, color: NEON, fontFamily: 'Bebas Neue, sans-serif', letterSpacing: 2 }}>
              {avg.toFixed(1)}<span style={{ fontSize: 20, color: '#888', marginLeft: 4 }}>kg</span>
            </div>
            <div style={{ fontSize: 11, color: '#666', marginTop: 8 }}>
              Epley: {ep.toFixed(1)} · Brzycki: {br.toFixed(1)}
            </div>
          </div>

          <SectionLabel text="TRAINING %" />
          <div style={styles.percentGrid}>
            {percentages.map((p) => (
              <div key={p} style={styles.percentItem}>
                <div style={{ fontSize: 10, color: '#888' }}>{p}%</div>
                <div style={{ fontSize: 18, fontWeight: 600, color: '#eee', fontFamily: 'Bebas Neue, sans-serif' }}>
                  {(avg * p / 100).toFixed(1)}<span style={{ fontSize: 10, color: '#666' }}>kg</span>
                </div>
              </div>
            ))}
          </div>
          <div style={styles.note}>※ Epley式・Brzycki式の平均。3〜6レップでの記録が最も精度高い</div>
        </React.Fragment>
      )}
    </div>
  );
}
