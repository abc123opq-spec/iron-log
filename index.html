};

const epley = (w, r) => w * (1 + r / 30);

// === Simple line chart (SVG) ===
function MiniChart({ data }) {
  if (data.length === 0) return null;
  const W = 320, H = 160, P = 24;
  const ys = data.map(d => d.oneRM);
  const minY = Math.min(...ys) * 0.9;
  const maxY = Math.max(...ys) * 1.05;
  const range = maxY - minY || 1;
  const stepX = data.length === 1 ? 0 : (W - P * 2) / (data.length - 1);
  const points = data.map((d, i) => {
    const x = P + i * stepX;
    const y = H - P - ((d.oneRM - minY) / range) * (H - P * 2);
    return { x, y, d };
  });
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 180 }}>
      {[0.25, 0.5, 0.75].map(t => (
        <line key={t} x1={P} y1={P + (H - P * 2) * t} x2={W - P} y2={P + (H - P * 2) * t}
          stroke={BORDER} strokeDasharray="3 3" strokeWidth="0.5" />
      ))}
      <path d={path} fill="none" stroke={NEON} strokeWidth="2" />
      {points.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="3" fill={NEON} />
      ))}
      {/* y-axis labels */}
      <text x={4} y={P + 4} fill="#666" fontSize="9">{maxY.toFixed(0)}</text>
      <text x={4} y={H - P + 4} fill="#666" fontSize="9">{minY.toFixed(0)}</text>
      {/* x-axis: first and last date */}
      <text x={P} y={H - 6} fill="#666" fontSize="9">{data[0]?.date}</text>
      {data.length > 1 && <text x={W - P} y={H - 6} fill="#666" fontSize="9" textAnchor="end">{data[data.length - 1]?.date}</text>}
    </svg>
  );
}

function App() {
  const [view, setView] = useState('log');
  const [sessions, setSessions] = useState(() => storage.get('sessions') || []);
  const [favorites, setFavorites] = useState(() => storage.get('favorites') || []);
  const [selectedExerciseId, setSelectedExerciseId] = useState(null);
  const [weight, setWeight] = useState('');
  const [reps, setReps] = useState('');
  const [toast, setToast] = useState('');
  const [showPicker, setShowPicker] = useState(false);
  const [pickerGroup, setPickerGroup] = useState('全部');
  const [pickerSearch, setPickerSearch] = useState('');

  useEffect(() => { storage.set('sessions', sessions); }, [sessions]);
  useEffect(() => { storage.set('favorites', favorites); }, [favorites]);

  const toggleFavorite = (id) => {
    setFavorites(favorites.includes(id) ? favorites.filter(x => x !== id) : [...favorites, id]);
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2000);
  };

  const logSet = () => {
    if (!selectedExerciseId || !weight || !reps) { showToast('全部入れてね'); return; }
    const w = parseFloat(weight);
    const r = parseInt(reps);
    if (isNaN(w) || isNaN(r) || w <= 0 || r <= 0) { showToast('数値が変だよ'); return; }
    const newSession = {
      id: 'ses_' + Date.now(),
      date: new Date().toISOString(),
      exerciseId: selectedExerciseId,
      weight: w,
      reps: r,
    };
    setSessions([newSession, ...sessions]);
    setWeight(''); setReps('');
    const ex = PRESET_EXERCISES.find((e) => e.id === selectedExerciseId);
    const oneRM = (w * (1 + r / 30)).toFixed(1);
    showToast(`${ex.name} ${w}kg×${r} → 1RM ${oneRM}kg`);
  };

  const deleteSession = (id) => setSessions(sessions.filter((s) => s.id !== id));

  const usedExercises = useMemo(() => {
    const ids = [...new Set(sessions.map(s => s.exerciseId))];
    return ids.map(id => PRESET_EXERCISES.find(e => e.id === id)).filter(Boolean);
  }, [sessions]);

  const stats = useMemo(() => {
    const byEx = {};
    PRESET_EXERCISES.forEach((e) => {
      const list = sessions.filter((s) => s.exerciseId === e.id);
      const max1RM = list.reduce((m, s) => Math.max(m, epley(s.weight, s.reps)), 0);
      byEx[e.id] = { count: list.length, max1RM };
    });
    return byEx;
  }, [sessions]);

  const totalVolume = useMemo(() => sessions.reduce((sum, s) => sum + s.weight * s.reps, 0), [sessions]);
  const last7Days = useMemo(() => {
    const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
    return sessions.filter((s) => new Date(s.date).getTime() > cutoff).length;
  }, [sessions]);

  const pickerList = useMemo(() => {
    let list = PRESET_EXERCISES;
    if (pickerGroup !== '全部') list = list.filter(e => e.group === pickerGroup);
    if (pickerSearch.trim()) {
      const q = pickerSearch.trim().toLowerCase();
      list = list.filter(e => e.name.toLowerCase().includes(q));
    }
    return list;
  }, [pickerGroup, pickerSearch]);

  return (
    <div style={styles.app}>
      <div style={styles.header}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <IconDumbbell size={24} color={NEON} />
          <div>
            <div style={styles.brand}>IRON LOG</div>
            <div style={styles.subBrand}>workout tracker</div>
          </div>
        </div>
        <div style={{ display: 'flex', gap: 12 }}>
          <Stat label="TOTAL VOL" value={`${(totalVolume / 1000).toFixed(1)}t`} />
          <Stat label="7D" value={last7Days} />
        </div>
      </div>

      <div style={styles.content} className="scroll">
        {view === 'log' && (
          <LogView
            sessions={sessions} favorites={favorites}
            selectedExerciseId={selectedExerciseId} setSelectedExerciseId={setSelectedExerciseId}
            setShowPicker={setShowPicker}
            weight={weight} setWeight={setWeight}
            reps={reps} setReps={setReps}
            logSet={logSet} deleteSession={deleteSession}
          />
        )}
        {view === 'history' && <HistoryView sessions={sessions} usedExercises={usedExercises} setSessions={setSessions} favorites={favorites} setFavorites={setFavorites} showToast={showToast} />}
        {view === 'browse' && <BrowseView stats={stats} favorites={favorites} toggleFavorite={toggleFavorite} />}
        {view === 'calc' && <CalcView />}
      </div>

      <div style={styles.tabBar}>
        <Tab icon={<IconZap size={18} />} label="記録" active={view === 'log'} onClick={() => setView('log')} />
        <Tab icon={<IconActivity size={18} />} label="履歴" active={view === 'history'} onClick={() => setView('history')} />
        <Tab icon={<IconTarget size={18} />} label="種目" active={view === 'browse'} onClick={() => setView('browse')} />
        <Tab icon={<IconTrend size={18} />} label="1RM" active={view === 'calc'} onClick={() => setView('calc')} />
      </div>

      {showPicker && (
        <ExercisePicker
          list={pickerList}
          group={pickerGroup} setGroup={setPickerGroup}
          search={pickerSearch} setSearch={setPickerSearch}
          favorites={favorites} toggleFavorite={toggleFavorite}
          onPick={(id) => { setSelectedExerciseId(id); setShowPicker(false); setPickerSearch(''); }}
          onClose={() => { setShowPicker(false); setPickerSearch(''); }}
        />
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}

function LogView({ sessions, favorites, selectedExerciseId, setSelectedExerciseId, setShowPicker, weight, setWeight, reps, setReps, logSet, deleteSession }) {
  const today = new Date().toDateString();
  const todaySessions = sessions.filter((s) => new Date(s.date).toDateString() === today);
  const selectedExercise = PRESET_EXERCISES.find(e => e.id === selectedExerciseId);

  const recentIds = [...new Set(sessions.slice(0, 30).map(s => s.exerciseId))].slice(0, 5);
  const quickIds = [...new Set([...favorites, ...recentIds])].slice(0, 6);
  const quickExercises = quickIds.map(id => PRESET_EXERCISES.find(e => e.id === id)).filter(Boolean);

  // 前回の記録(選択中種目、今日のセッションを除く直近の同一日の全セット)
  const lastWorkout = useMemo(() => {
    if (!selectedExerciseId) return null;
    const past = sessions
      .filter(s => s.exerciseId === selectedExerciseId && new Date(s.date).toDateString() !== today);
    if (past.length === 0) return null;
    const lastDate = new Date(past[0].date).toDateString();
    const sets = past.filter(s => new Date(s.date).toDateString() === lastDate);
    return { date: lastDate, sets };
  }, [selectedExerciseId, sessions, today]);

  // 次セットの推奨(ダブルプログレッション法、目標8回)
  const TARGET_REPS = 8;
  const recommendation = useMemo(() => {
    if (!selectedExerciseId) return null;
    const todayForEx = todaySessions.filter(s => s.exerciseId === selectedExerciseId);
    // 今日まだ未着手 → 前回最終セットを基準にダブルプログレッション
    if (todayForEx.length === 0) {
      if (!lastWorkout) return null;
      const lastSet = lastWorkout.sets[0]; // sessionsは新しい順なので[0]が最終セット
      const achieved = lastSet.reps >= TARGET_REPS;
      return {
        weight: achieved ? lastSet.weight + 2.5 : lastSet.weight,
        reps: TARGET_REPS,
        reason: achieved ? `前回${lastSet.weight}kg×${lastSet.reps}回達成 +2.5kg` : `前回${lastSet.weight}kg×${lastSet.reps}回 据え置き`
      };
    }
    // 今日2セット目以降 → 直前セットを見て調整
    const prev = todayForEx[0];
    if (prev.reps >= TARGET_REPS) {
      return { weight: prev.weight + 2.5, reps: TARGET_REPS, reason: `${prev.reps}回達成 +2.5kg` };
    } else if (prev.reps < TARGET_REPS - 3) {
      return { weight: Math.max(0, prev.weight - 2.5), reps: TARGET_REPS, reason: `${prev.reps}回 −2.5kg` };
    }
    return { weight: prev.weight, reps: TARGET_REPS, reason: `${prev.reps}回 同重量で継続` };
  }, [selectedExerciseId, todaySessions, lastWorkout]);

  const applyRecommendation = () => {

function HistoryView({ sessions, usedExercises, setSessions, favorites, setFavorites, showToast }) {
  const [picked, setPicked] = useState(usedExercises[0]?.id || null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    if (picked && !usedExercises.find(e => e.id === picked)) setPicked(usedExercises[0]?.id || null);
    else if (!picked && usedExercises.length > 0) setPicked(usedExercises[0].id);
  }, [usedExercises, picked]);

  const exportData = () => {
    const data = {
      app: 'IRON LOG',
      version: 1,
      exportedAt: new Date().toISOString(),
      sessions,
      favorites
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10).replace(/-/g, '');
    a.download = `iron-log-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`${sessions.length}セットをエクスポート`);
  };

  const importData = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.sessions || !Array.isArray(data.sessions)) throw new Error('形式が違います');
        const mode = window.confirm(
          `${data.sessions.length}セットを読み込みます。\n\n[OK] 現在の記録と統合(重複は除外)\n[キャンセル] 何もしない`
        );
        if (!mode) return;
        const existingIds = new Set(sessions.map(s => s.id));
        const merged = [...sessions];
        let added = 0;
        data.sessions.forEach(s => {
          if (!existingIds.has(s.id)) { merged.push(s); added++; }
        });
        merged.sort((a, b) => new Date(b.date) - new Date(a.date));
        setSessions(merged);
        if (Array.isArray(data.favorites)) {
          setFavorites([...new Set([...favorites, ...data.favorites])]);
        }
        showToast(`${added}セットを追加`);
      } catch (err) {
        alert('読み込みに失敗しました: ' + err.message);
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  };

  const chartData = useMemo(() => {
    if (!picked) return [];
    return sessions
      .filter((s) => s.exerciseId === picked)
      .slice().reverse()
      .map((s) => ({
        date: new Date(s.date).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }),
        oneRM: parseFloat((s.weight * (1 + s.reps / 30)).toFixed(1)),
      }));
  }, [picked, sessions]);

  const backupSection = (
    <React.Fragment>
      <SectionLabel text="BACKUP" />
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <button onClick={exportData} style={{
          flex: 1, background: '#141414', border: '1px solid #222',
          color: '#eee', padding: '10px 12px', borderRadius: 10,
          fontFamily: 'inherit', fontSize: 12, letterSpacing: 1, cursor: 'pointer'
        }}>
          <span style={{ color: NEON, marginRight: 6 }}>↓</span>EXPORT
        </button>
        <button onClick={() => fileInputRef.current?.click()} style={{
          flex: 1, background: '#141414', border: '1px solid #222',
          color: '#eee', padding: '10px 12px', borderRadius: 10,
          fontFamily: 'inherit', fontSize: 12, letterSpacing: 1, cursor: 'pointer'
        }}>
          <span style={{ color: NEON, marginRight: 6 }}>↑</span>IMPORT
        </button>
        <input ref={fileInputRef} type="file" accept="application/json,.json" onChange={importData} style={{ display: 'none' }} />
      </div>
    </React.Fragment>
  );

  if (usedExercises.length === 0) {
    return (
      <div style={{ animation: 'slideUp 0.3s ease' }}>
        {backupSection}
        <SectionLabel text="PROGRESS" />
        <div style={styles.empty}>まずは記録から始めよう</div>
      </div>
    );
  }

  return (
    <div style={{ animation: 'slideUp 0.3s ease' }}>
      {backupSection}
      <SectionLabel text="PROGRESS" />
      <div style={{ display: 'flex', gap: 8, overflowX: 'auto', paddingBottom: 8, marginBottom: 16 }} className="scroll">
        {usedExercises.map((ex) => (
          <button key={ex.id} onClick={() => setPicked(ex.id)}
            style={{ ...styles.chip, ...(picked === ex.id ? styles.chipActive : {}) }}>
            {ex.name}
          </button>
        ))}
      </div>

      {chartData.length > 0 && (
        <React.Fragment>
          <div style={{ ...styles.card, padding: 16 }}>
            <div style={{ fontSize: 11, color: '#888', letterSpacing: 1.5, marginBottom: 12 }}>推定1RMの推移</div>
            <MiniChart data={chartData} />
          </div>

          <SectionLabel text="ALL SETS" accent={`${chartData.length}`} />
          {sessions.filter((s) => s.exerciseId === picked).map((s) => {
            const date = new Date(s.date);
            const oneRM = (s.weight * (1 + s.reps / 30)).toFixed(1);
            return (
              <div key={s.id} style={styles.sessionRow}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, color: '#eee' }}>{s.weight}kg × {s.reps}</div>
                  <div style={{ fontSize: 11, color: '#666', marginTop: 2 }}>
                    {date.toLocaleDateString('ja-JP')} · 1RM {oneRM}kg
                  </div>
                </div>
              </div>
            );
          })}
        </React.Fragment>
      )}
    </div>
  );
}

function CalcView() {
  const [w, setW] = useState('');
  const [r, setR] = useState('');
  const wn = parseFloat(w);
  const rn = parseInt(r);
  const valid = !isNaN(wn) && !isNaN(rn) && wn > 0 && rn > 0;
  const ep = valid ? wn * (1 + rn / 30) : 0;
  const br = valid && rn < 37 ? wn / (1.0278 - 0.0278 * rn) : 0;
  const avg = valid ? (ep + br) / 2 : 0;
  const percentages = [95, 90, 85, 80, 75, 70, 65, 60];

  return (
    <div style={{ animation: 'slideUp 0.3s ease' }}>
      <SectionLabel text="1RM CALCULATOR" />
      <div style={styles.card}>
        <div style={{ display: 'flex', gap: 12 }}>
          <div style={{ flex: 1 }}>
            <label style={styles.inputLabel}>WEIGHT (kg)</label>
            <input type="number" inputMode="decimal" value={w} onChange={(e) => setW(e.target.value)} placeholder="80" style={styles.input} />
          </div>
          <div style={{ flex: 1 }}>
            <label style={styles.inputLabel}>REPS</label>
            <input type="number" inputMode="numeric" value={r} onChange={(e) => setR(e.target.value)} placeholder="5" style={styles.input} />
          </div>
        </div>
      </div>

      {valid && (
        <React.Fragment>
          <div style={{ ...styles.card, textAlign: 'center', padding: 24, animation: 'glow 2s infinite' }}>
            <div style={{ fontSize: 11, color: '#888', letterSpacing: 2, marginBottom: 8 }}>推定 1RM</div>
            <div style={{ fontSize: 48, fontWeight: 700, color: NEON, fontFamily: 'Bebas Neue, sans-serif', letterSpacing: 2 }}>
              {avg.toFixed(1)}<span style={{ fontSize: 20, color: '#888', marginLeft: 4 }}>kg</span>
            </div>
            <div style={{ fontSize: 11, color: '#666', marginTop: 8 }}>
              Epley: {ep.toFixed(1)} · Brzycki: {br.toFixed(1)}
            </div>
          </div>

          <SectionLabel text="TRAINING %" />
          <div style={styles.percentGrid}>
            {percentages.map((p) => (
              <div key={p} style={styles.percentItem}>
                <div style={{ fontSize: 10, color: '#888' }}>{p}%</div>
                <div style={{ fontSize: 18, fontWeight: 600, color: '#eee', fontFamily: 'Bebas Neue, sans-serif' }}>
                  {(avg * p / 100).toFixed(1)}<span style={{ fontSize: 10, color: '#666' }}>kg</span>
                </div>
              </div>
            ))}
          </div>
          <div style={styles.note}>※ Epley式・Brzycki式の平均。3〜6レップでの記録が最も精度高い</div>
        </React.Fragment>
      )}
    </div>
  );
}
